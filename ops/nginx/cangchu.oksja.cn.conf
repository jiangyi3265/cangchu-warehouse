server {
    listen 80;
    listen [::]:80;
    server_name cangchu.oksja.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/cangchu.oksja.cn;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://cangchu.oksja.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cangchu.oksja.cn;
    ssl_certificate /etc/letsencrypt/live/cangchu.oksja.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cangchu.oksja.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CangchuSSL:1m;
    ssl_session_timeout 1d;
    client_max_body_size 20m;
    access_log /www/wwwlogs/cangchu.oksja.cn.log;
    error_log /www/wwwlogs/cangchu.oksja.cn.error.log;
    root /opt/cangchu-ruoyi/current/web;
    index index.html;
    add_header X-Cangchu-Release ruoyi-20261117T012436Z always;
    add_header X-Content-Type-Options nosniff always;
    location ^~ /dev-api/ {
        proxy_pass http://127.0.0.1:19474/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        add_header Cache-Control no-store always;
    }
    location = /dev-api { return 404; }
    location ^~ /api/ {
        default_type application/json;
        return 410 '{"code":410,"msg":"Website upgraded. Refresh to use the new RuoYi application."}';
    }
    location ^~ /static/ {
        try_files $uri =404;
        gzip_static on;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Cangchu-Release ruoyi-20261117T012436Z always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache always;
        add_header X-Cangchu-Release ruoyi-20261117T012436Z always;
    }
}
